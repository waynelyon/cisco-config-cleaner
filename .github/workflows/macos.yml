name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test native app
        run: zsh build.sh
      - name: Build and verify universal release
        run: zsh release.sh
      - name: Verify release checksum
        run: cd releases && shasum -a 256 -c SHA256SUMS.txt
      - name: Upload tested universal archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cisco-config-cleaner-universal
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
